name: Mirror private fallback rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rule/Surge/AppPrivacyServices/GIF.list
      - rule/Surge/AppPrivacyServices/MiHome.list
      - rule/Surge/AppPrivacyServices/Taobao.list
      - rule/Surge/AppPrivacyServices/Quark.list

permissions:
  contents: read

concurrency:
  group: public-main-writes
  cancel-in-progress: false

jobs:
  mirror:
    if: "!contains(github.event.head_commit.message, '[mirror-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public fallback rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("rule/Surge/AppPrivacyServices")
          allowed = {
              "AND", "ASN", "DEST-PORT", "DOMAIN", "DOMAIN-KEYWORD", "DOMAIN-SET",
              "DOMAIN-SUFFIX", "DOMAIN-WILDCARD", "FINAL", "GEOIP", "IP-CIDR",
              "IP-CIDR6", "IP-ASN", "IN-PORT", "IN-TYPE", "NOT", "OR",
              "PROCESS-NAME", "PROTOCOL", "RULE-SET", "SCRIPT", "SRC-IP-CIDR",
              "URL-REGEX", "USER-AGENT",
          }
          issues = []
          for name in ("GIF", "MiHome", "Taobao", "Quark"):
              path = root / f"{name}.list"
              if not path.exists():
                  issues.append(f"缺少规则集: {path}")
                  continue
              seen = {}
              for number, raw in enumerate(path.read_text(encoding="utf-8-sig").splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith(("#", ";", "//")):
                      continue
                  parts = [part.strip() for part in line.split(",")]
                  if not parts or parts[0].upper() not in allowed:
                      issues.append(f"{path}:{number} 未知规则类型: {raw}")
                      continue
                  if len(parts) < 2 or not parts[1]:
                      issues.append(f"{path}:{number} 规则缺少匹配内容: {raw}")
                  if line in seen:
                      issues.append(f"{path}:{number} 重复规则，首次出现于第 {seen[line]} 行")
                  else:
                      seen[line] = number
          if issues:
              raise SystemExit("\n".join(issues))
          print("公开镜像规则集校验通过")
          PY

      - name: Mirror fallback rules to private repository
        env:
          MIRROR_TOKEN: ${{ secrets.RULESET_MIRROR_TOKEN }}
          TARGET_REPO: lylywayr/Auto-AppPrivacy-Private-Rules
          TARGET_DIR: rule/Surge/AppPrivacyServices
        run: |
          set -eu
          test -n "$MIRROR_TOKEN"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/${TARGET_REPO}.git" target
          mkdir -p "target/${TARGET_DIR}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="GIF.list MiHome.list Taobao.list Quark.list"
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- rule/Surge/AppPrivacyServices | sed -n 's#^rule/Surge/AppPrivacyServices/##p')
          fi
          test -n "$files"
          for file in $files; do
            cp "rule/Surge/AppPrivacyServices/${file}" "target/${TARGET_DIR}/${file}"
          done
          cd target
          if git diff --quiet; then
            echo "Private mirror already matches"
            exit 0
          fi
          git add -- "$TARGET_DIR"
          git commit -m "[mirror-sync] Sync fallback rules from public repository"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Mirror conflict or push failure (${attempt}/3)"
          done
          echo "Mirror failed; resolve the conflicting fallback rule file manually."
          exit 1
